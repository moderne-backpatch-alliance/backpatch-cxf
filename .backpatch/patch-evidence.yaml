  note: "2021 tests at the patch commit, 9 of them skipped by the suite, 0 failed, 0 errors. Suite of record in a Linux container (release/cxf-3.5/SUITE-ENV.md) with upstream's test-only certificate renewals 13fc94bb3c and 0dcfe16bab (test keystores only) applied first; the expired testutils certificates turned 79 signed/SAML tests red on 3.5.11 itself. Accepted verifier finding A: 9 classes of Central's cxf-rt-rs-security-oauth2 3.5.11 sources jar are generated JPA metamodel *_ classes, not in the tree; no source this port changes. CVE-2026-50629's proof is AbstractTokenServiceLogTest, a test written by us (upstream has none); CVE-2026-50630's is upstream's AuthorizationUtilsTest. New-file headers: services/AbstractTokenServiceLogTest.java and services/AbstractTokenServiceTest.java have no file in their package, its parent packages or the module's src/test/java root; both headers are byte-identical to the nearest test file in the module, oauth2/client/OAuthClientUtilsTest.java, and AbstractTokenServiceTest.java's also to upstream's own copy at ca12d09739."
